<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-950">
    <div id="root"></div>
    
    <script type="text/babel">
      function App() {
        const [count, setCount] = React.useState(0);
        
        return (
          <div className="min-h-screen flex items-center justify-center text-white">
            <div className="text-center space-y-6">
              <h1 className="text-4xl font-bold">Pulse Chat شغال ✅</h1>
              <p className="text-slate-400">الزراير شغالة أهي</p>
              
              <button 
                onClick={() => setCount(count + 1)}
                className="bg-indigo-500 hover:bg-indigo-600 px-8 py-4 rounded-xl text-lg font-semibold transition"
              >
                دوست {count} مرة
              </button>
              
              <button 
                onClick={() => alert('Firebase + ReCAPTCHA هنضيفهم بعدين')}
                className="block mx-auto bg-slate-800 hover:bg-slate-700 px-6 py-3 rounded-xl border-slate-700"
              >
                تسجيل دخول تجريبي
              </button>
            </div>
          </div>
        );
      }
      
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
  </html>
