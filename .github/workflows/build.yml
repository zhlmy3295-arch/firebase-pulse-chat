name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase-pulse-chat
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: false

    - name: Install
      run: npm install

    - name: Build
      run: npm run build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: firebase-pulse-chat
        path: firebase-pulse-chat/dist
