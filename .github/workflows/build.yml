name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: cd firebase-pulse-chat && npm install
    - run: cd firebase-pulse-chat && npm run build
    - uses: actions/upload-artifact@v4
      with:
        name: firebase-pulse-chat
        path: firebase-pulse-chat/dist
